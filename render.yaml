# Render Blueprint — FastAPI backend (see Docs/deployment-render-vercel.md)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: zomato-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.backend.phase6.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: RENDER
        value: "true"
      - key: DISABLE_DATA_INGEST
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LOG_LEVEL
        value: INFO
      - key: SHORTLIST_SIZE
        value: "15"
      - key: DISPLAY_TOP_K
        value: "5"
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
