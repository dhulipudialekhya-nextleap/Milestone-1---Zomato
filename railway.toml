# Railway — FastAPI backend (see Docs/deployment-railway-vercel.md)
# Do NOT set buildCommand here — Nixpacks installs Python + deps from requirements.txt

[build]
builder = "NIXPACKS"

[build.env]
NIXPACKS_PYTHON_VERSION = "3.12"

[deploy]
startCommand = "python -m uvicorn src.backend.phase6.server:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
