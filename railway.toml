# Railway — Docker deploy (see Docs/deployment-railway-vercel.md)
# No healthcheckPath here — avoids false "health check failure" during cold start.
# Verify manually: https://YOUR-SERVICE.up.railway.app/health

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
